# Netlify settings: a plain static site, no build step.
[build]
  publish = "site"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# The cost page was removed on 27 Oct 2026; old links go to the home page.
[[redirects]]
  from = "/costs"
  to = "/"
  status = 301

[[redirects]]
  from = "/costs.html"
  to = "/"
  status = 301
